# Dev Profile Configuration
spring.application.name=STAGE-MANAGEMENT-BACKEND

# Server configuration
server.port=${PORT:9001}

# CORS Configuration
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000,http://localhost:5173}

# SQL Server configuration - local
spring.datasource.url=${SQL_SERVER_DATABASE_URL};encrypt=false;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# File upload configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Swagger/OpenAPI configuration
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# MinIO configuration
minio.url=${MINIO_URL:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket-name=${MINIO_BUCKET_NAME:stage-management}
minio.region=${MINIO_REGION:us-east-1}
minio.presigned-url.expiry-minutes=60

# JWT configuration
jwt.secret=${JWT_SECRET:devSecretKey_changeMeInProduction_mustBe256BitsLong!!}
jwt.access-token.expiration-ms=${JWT_ACCESS_EXPIRATION:900000}
jwt.refresh-token.expiration-ms=${JWT_REFRESH_EXPIRATION:604800000}
jwt.ws-ticket.expiration-ms=30000

# Cookies configuration
app.cookies.secure=${COOKIE_SECURE:false}
app.cookies.same-site=${COOKIE_SAME_SITE:Lax}
app.auth.tokens-in-body=${AUTH_TOKENS_IN_BODY:true}

# Compte administrateur initial
app.admin.email=${ADMIN_EMAIL:admin@gmail.com}
app.admin.password=${ADMIN_PASSWORD:password}

# Logging configuration
logging.level.org.springframework.scheduling=INFO
logging.level.root=INFO

# Mail configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
