spring.application.name=STAGE-MANAGEMENT-BACKEND

# tomcat configuration (9001 = port attendu par défaut par le frontend)
server.port=${PORT:9001}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# CORS / WebSocket : origines autorisées (séparées par des virgules, motifs acceptés ex: https://*.vercel.app)
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173}

#postgreSQl configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stage_management}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Taille maximale des fichiers (CV) : source unique (l'ancienne classe FileUploadConfig fixait 10 Mo en conflit avec 5 Mo ici)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
spring.jpa.hibernate.ddl-auto=update

#minio configuration
# URL du serveur MinIO
minio.url=${MINIO_URL:http://localhost:9000}

# Cles d'acces MinIO
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}

# Nom du bucket ou stocker les fichiers
minio.bucket-name=${MINIO_BUCKET_NAME:stage-management}
minio.region=${MINIO_REGION:us-east-1}
# Durée de validité des liens de téléchargement des CV générés à la volée
minio.presigned-url.expiry-minutes=60

# JWT : secret Base64 d'au moins 256 bits (ex : openssl rand -base64 64)
jwt.secret=${JWT_SECRET}
# Access token : 15 minutes / Refresh token : 7 jours
jwt.access-token.expiration-ms=${JWT_ACCESS_EXPIRATION:900000}
jwt.refresh-token.expiration-ms=${JWT_REFRESH_EXPIRATION:604800000}
# Ticket WebSocket (30 s, usage unique)
jwt.ws-ticket.expiration-ms=30000
# Cookies d'authentification HttpOnly (Secure désactivé en local : http://localhost)
app.cookies.secure=${COOKIE_SECURE:false}
app.cookies.same-site=${COOKIE_SAME_SITE:Lax}
# Renvoyer aussi les jetons dans le corps JSON (pratique pour Swagger/Postman en local)
app.auth.tokens-in-body=${AUTH_TOKENS_IN_BODY:true}
logging.level.org.springframework.scheduling=INFO

# Compte administrateur créé au premier démarrage (si aucun administrateur n'existe)
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}


# mail configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
