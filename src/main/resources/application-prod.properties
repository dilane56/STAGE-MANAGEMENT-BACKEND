# Production Profile Configuration
spring.application.name=STAGE-MANAGEMENT-BACKEND

# Server configuration
server.port=${PORT:8080}

# CORS Configuration (add your frontend URLs, wildcards allowed e.g. https://*.vercel.app)
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000}

# PostgreSQL configuration - Neon
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5


# File upload configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Swagger/OpenAPI configuration (désactivable en production : SWAGGER_ENABLED=false)
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}

# MinIO configuration (using environment variables)
minio.url=${MINIO_URL}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket-name=${MINIO_BUCKET_NAME:stage-management}
minio.region=${MINIO_REGION:us-east-1}
minio.presigned-url.expiry-minutes=60

# JWT configuration (using environment variables)
jwt.secret=${JWT_SECRET}
jwt.access-token.expiration-ms=${JWT_ACCESS_EXPIRATION:900000}
jwt.refresh-token.expiration-ms=${JWT_REFRESH_EXPIRATION:604800000}
jwt.ws-ticket.expiration-ms=30000
# Cookies d'authentification HttpOnly
app.cookies.secure=${COOKIE_SECURE:true}
app.cookies.same-site=${COOKIE_SAME_SITE:Lax}
app.auth.tokens-in-body=${AUTH_TOKENS_IN_BODY:false}

# Compte administrateur initial (définir obligatoirement ADMIN_PASSWORD en production)
app.admin.email=${ADMIN_EMAIL:admin@gmail.com}
app.admin.password=${ADMIN_PASSWORD:password}

# Logging configuration
logging.level.org.springframework.scheduling=INFO
logging.level.root=INFO

# Mail configuration (using environment variables)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
